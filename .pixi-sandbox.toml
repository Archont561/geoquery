schema = 1
branch_prefix = "sandbox"
# `true`, and the reason it could be `false` is the point: pixi-sandbox looks for a Cargo
# manifest at the repository root, and for a long time there was none — the workspace root
# was `crates/`, because the directory a conda package is built from has to be the root of
# a workspace that is itself a package (cargo install cannot install from a virtual
# manifest). The manifest now lives at the repository root and the two constraints are
# satisfied by one file, so the crate sources travel in the transport.
#
# That is what makes this transport worth its size. With vendoring off, an airgapped machine
# could restore the toolchain and then discover it had no way to obtain the 435 crates in
# Cargo.lock — the environment solved, the build impossible. Vendored, it runs
# `cargo build --offline` and compiles the workspace the project will actually be built
# from, which is the entire purpose of restoring an environment on a machine with no
# network. The cost is a large transport, paid once per dependency change.
cargo_vendor = true

[[bundle]]
name = "developer"
environments = ["default"]
platforms = ["linux-64"]
