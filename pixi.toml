# geoquery — THE workspace manifest.
#
# This file is the environment. Four feature layers, one environment, one lockfile:
#
#   rust     the toolchain the engine will be built with: rust, cargo-nextest,
#            cargo-llvm-cov, cargo-deny
#   js       bun, the only JavaScript runtime here
#   python   the interpreter and native SDK toolchain: pytest, pytest-cov, ruff, maturin,
#            pip
#   utils    the repository's own instruments: convco, lefthook, actionlint
#
# The layers exist so a version bump to one toolchain is its own reviewable diff, and
# so `default` (all four) is a deliberate statement rather than an accident of
# whatever was last added.
#
# The toolchain is pinned rather than inherited. `pixi.lock` records the exact compiler
# the CLI is built and gated with, so a contributor's rustup version cannot decide whether
# `pixi run gates` passes. That mattered before there was Rust source and matters more
# now that there is: a dependency that needs a newer rustc than the lockfile names fails
# in CI and nowhere else.
#
# There is no Node.js anywhere in this manifest. `bun` is the only JavaScript runtime,
# and it carries the JS toolchain (turbo, biome) as workspace packages rather than
# conda dependencies: conda-forge has no `turbo` (verified against the channel), and
# `biome` is resolved from `package.json` so one lockfile decides both the linter and
# the version its `biome.json` schema names. Tasks therefore reach the JS toolchain
# through `bun x` / `bun run`, never through a `node_modules/.bin` path — those entries
# carry a `node` shebang, which no environment here provides.
#
# The Python toolchain lives *in* the environment rather than in a venv: conda-forge
# carries the interpreter, pip, pytest, ruff and maturin, so the native SDK build toolchain
# is one `pixi.lock`. `py-install` uses pip's editable mode with the maturin backend; the
# Rust dependencies are resolved by Cargo from the workspace lockfile rather than by pip.
# It is `python -m pip`, not `pip`: PATH is not trustworthy inside a task, and
# conda-forge's interpreter is the one that must run it.
#
# Both SDKs cross into Rust in-process, and neither is a Phase 6 decision any more: the
# PyO3 extension and the N-API addon are both in the workspace, and `maturin` is here
# because the Python wheel is built with it. The rule that decided otherwise — a toolchain
# nobody invokes is a download every sandbox restore pays for — now points the other way,
# because both of these are invoked. What has *not* changed is the reason the bindings are
# thin: `geoquery-core` owns what a query means, and a binding that interpreted it would
# give each SDK a second opinion. Neither interface speaks HTTP.
#
# The TypeScript side needs no conda toolchain of its own, because cargo already builds
# the addon and the workspace lockfile already carries `napi`. That is the reason there is
# no `@napi-rs/cli` here: a second build tool for a cdylib cargo can produce would be a
# second thing to keep in step, and it would arrive as a binary fetched outside `pixi.lock`.
#
# `convco`, `lefthook` and `actionlint` are conda dependencies, not npm ones: the git
# hooks must work on a machine restored from the sandbox branch, and
# `scripts/restore.sh` puts a restored `default` environment's `bin/` on PATH but no
# `node_modules`.
#
# Divergence from .knowledge: the KB describes `cargo xtask ci` as the local CI
# reproduction, and describes the task runner as part of the repository. Here pixi is
# the task runner, because pixi is what the hooks and the workflows call and there is
# no reason for a second entry point over the same commands. `xtask` will exist for
# one job only — code generation, which needs the workspace's own types in memory.
#
# Pins (verified 2026-09-30): rust 1.98.x, bun 1.3.x, python 3.13.x, convco 0.7.x,
# lefthook 2.1.x, actionlint 1.7.x (conda-forge). Adding a pin means one `pixi lock` to
# refresh pixi.lock — `pixi install --locked` in CI and the devcontainer fails until that
# lands. See .knowledge/ for the architecture these layers serve.

[workspace]
name = "geoquery"
version = "0.1.0"
description = "One protocol-independent query language and execution engine for federating geospatial resources and services"
authors = ["Archont561 <142521648+Archont561@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Archont561/geoquery"
repository = "https://github.com/Archont561/geoquery"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.81.0"
# `pixi-build` is what lets a sub-manifest carry a `[package]` table, i.e. what lets
# `[package]` below and `python/geoquery/pixi.toml` describe the conda packages that
# `pixi publish` builds. It is a preview flag, so it is opted into here, in the one
# manifest that owns the workspace — opting in per package would mean a workspace whose
# members disagree about whether building is allowed.
preview = ["pixi-build"]

# One place to bump a version; the tables below opt in with { workspace = true }. The
# npm and PyPI manifests are checked against this number by `pixi run version-check`,
# which is in the `gates` aggregator — three manifests edited by hand is three chances
# to forget, and a published artefact with the wrong version is a bug nobody reports.
[workspace.dependencies]
rust = ">=1.98.1,<1.99"
bun = ">=1.3.11,<2"
python = ">=3.13,<3.14"
pytest = ">=8.4,<9"
pytest-asyncio = ">=1.2,<2"
pytest-cov = ">=6,<7"
ruff = ">=0.14,<0.15"
maturin = ">=1.7,<2"
pip = ">=26,<27"
convco = ">=0.7.2,<0.8"
lefthook = ">=2.1.15,<3"
actionlint = ">=1.7.12,<2"

# ── feature layers ────────────────────────────────────────────────────────────
# `default` carries all four; the layers exist so each toolchain's version bump is its
# own diff, and so a consumer who only wants one runtime does not drag the others in.

[feature.rust.dependencies]
# The toolchain the engine is built and gated with.
#
# `cargo-nextest`, `cargo-llvm-cov` and `cargo-deny` are conda-forge packages rather
# than `cargo install` invocations: a `cargo install` binary is built from source into
# ~/.cargo/bin on every fresh clone and on every devcontainer, and it is absent from
# the published sandbox branch, so a restored airlock could not run the same gates the
# developer ran. As conda dependencies they travel with `pixi.lock` in the `default`
# environment that `.pixi-sandbox.toml` packs.
#
# Still no `cross`. Cross-compiling is a toolchain nobody invokes: the addon and the wheel
# are both built for the one platform this repository is locked to, and `cross` would add a
# Docker requirement to a toolchain that deliberately has none.
rust = { workspace = true }
cargo-nextest = ">=0.9.144,<0.10"
cargo-llvm-cov = ">=0.9.1,<0.10"
cargo-deny = ">=0.20.2,<0.21"

[feature.js.dependencies]
# The only JavaScript runtime in the project.
bun = { workspace = true }

[feature.python.dependencies]
# The interpreter and native extension build toolchain, from one lockfile. The Python
# package crosses the Rust boundary in-process through PyO3 rather than using HTTP.
python = { workspace = true }
pytest = { workspace = true }
pytest-asyncio = { workspace = true }
# pytest-cov rather than `coverage` alone: it is the same coverage.py, wired into the
# runner the suite already uses, so the SDK's `cov` façade is one command instead of a
# `coverage run` wrapper that has to know where the sources are.
pytest-cov = { workspace = true }
ruff = { workspace = true }
maturin = { workspace = true }
# pip because `py-install` edits this package into the interpreter: an editable install
# is a build, and without a build backend in the environment it would either download one
# into a temporary venv or refuse. `python -m pip` with nothing to install into is the
# failure this dependency exists to prevent.
pip = { workspace = true }

[feature.utils.dependencies]
# Repo utilities shared by the git hooks and CI, so the two cannot drift.
#   convco     — conventional-commit check (commit-msg hook) + CHANGELOG.md
#   lefthook   — the hooks themselves; every hook delegates to a task below
#   actionlint — the GitHub Actions linter
convco = { workspace = true }
lefthook = { workspace = true }
actionlint = { workspace = true }

[environments]
# `default` is pixi's implicit environment, so a task runs as `pixi run <task>`:
# no `-e` flag in a shell, a git hook or a workflow step.
default = { features = [
  "rust",
  "js",
  "python",
  "utils",
] }

# ---------------------------------------------------------------------------
# Tasks. Everything a human, a git hook or a CI job does is one of these, so a
# GitHub Actions step can be a single line: `pixi run <task>`. Logic lives here
# (reviewable, runnable locally), not in workflow YAML.
#
# The per-language verbs (`*-rs`, `*-py`, `*-js`) that used to live here are gone: the
# package-specific work now lives in each package's own manifest and is orchestrated by
# turbo, so a repo-wide verb (`build`, `test`, `lint`, `typecheck`, `cov`, `fmt`) fans out
# across every language at once. What stays here is the repository-global work that has no
# single package to belong to. See the header comment on the `[tasks]` table below.
#
# NOTE (pixi 0.81): `default-environment` is only accepted on tasks that have a
# `cmd`. Pure aggregators (setup / gates / ci) omit it.
# ---------------------------------------------------------------------------

# The `[package]` table below makes this manifest two things at once: the pixi workspace
# root that owns the environment, and the `geoquery-cli` conda package that `pixi publish`
# builds. That is a deliberate merge, and it is forced by the same constraint that shapes
# `Cargo.toml`: `pixi-build-rust` runs `cargo install --locked --path <dir>`, and `cargo
# install` cannot install from a virtual manifest. The package's source directory is the
# directory holding its manifest, so the manifest has to sit beside the Cargo manifest that
# is also the package's. Keeping the package in a sub-manifest would mean the conda build
# ran from a directory that is not a Cargo package, and `pixi-build-rust` would have nothing
# to install.
#
# `[package.version]` is inherited from `[workspace].version` for the same reason the Cargo
# manifests are: `version-check` asserts every surface agrees, and it is a good deal easier
# to assert that than to maintain.

[package]
# The package name is not the crate name. `geoquery-cli` as a package installs the
# binary `geoquery`, and the distinction matters on a channel where a user searching
# for "geoquery" should find the library packages too.
name = "geoquery-cli"
# The root pixi.toml is the version authority for every published surface. This table
# inherits rather than restating it: `pixi run version-check` walks the manifests and
# fails on a literal, so the two cannot drift.
version = { workspace = true }
# The opt-in `pixi publish` looks for. Without it this package is buildable with
# `pixi build --path .` and invisible to a workspace-wide publish.
publish = true
license = "MIT OR Apache-2.0"
description = "Command-line client for geoquery"
readme = "crates/README.md"
repository = "https://github.com/Archont561/geoquery"
homepage = "https://github.com/Archont561/geoquery"

[package.build]
# pixi-build-rust runs `cargo install --locked --path . --root $PREFIX`, so the crate
# must be self-contained and carry its own Cargo.lock — it does, at the Cargo.lock
# beside this manifest, because this directory is the Cargo workspace root too.
backend = { name = "pixi-build-rust", version = ">=0.5,<0.6", channels = [
  "https://prefix.dev/conda-forge",
] }

[package.build.config]
# Only the C compiler. The backend defaults to `["rust", "c"]`, and the "rust" entry
# asks conda-forge's compiler infrastructure for `rust_linux-64` — a package that then
# requires the `rust` metapackage, which no longer exists: on conda-forge `rust` *is*
# the platform package (a 165 MB linux-64 artefact that already depends on
# gcc_impl_linux-64). Asking for both is an unsolvable environment, and the failure is
# a wall of "rust 1.xx.* for which no candidates were found" rather than a message about
# the compiler. The C entry is what supplies the linker; the toolchain comes from the
# pinned `rust` build dependency below.
compilers = ["c"]

# One binary, named explicitly. An empty list installs whatever cargo thinks a package
# produces, which is a decision made by a file that a later `src/bin/` would change
# silently.
binaries = ["geoquery"]
# `cargo install` already builds release; the profile lives in the root Cargo.toml where
# rustc reads it from, not here.
extra-args = []

[package.build-dependencies]
# The backend adds rust and cargo itself; pinning the compiler here is what makes a
# released binary reproducible across the years between this commit and the next one.
# Keep the bound in step with `rust` in [feature.rust.dependencies] below.
rust = ">=1.98.1,<1.99"

# No [package.host-dependencies] and no [package.run-dependencies]: the binary links
# the C runtime and nothing else. Declaring `libgcc-ng` or `openssl` here would be a
# promise to keep them in step with what the toolchain actually links.

[tasks]

# The package-specific work — build, test, lint, typecheck, coverage, format — no longer
# lives here. Each package owns its own commands, in the manifest a reader of that package
# already opens:
#
#   crates/package.json        the Rust workspace  (cargo build/nextest/clippy/deny/llvm-cov)
#   python/geoquery/package.json  the Python SDK    (pytest, ruff, pytest-cov)
#   packages/*, apps/*         the Bun workspace    (tsc, bun test, astro)
#
# Turbo owns the ordering and caching across those manifests; the tasks in the "repo-wide
# task graph" block below are the single entry point into it, so `pixi run test` still runs
# every language's tests and a CI step is still one line. What remains outside turbo is the
# work that is genuinely repository-global — versions, the changelog, the Actions lint, the
# conda publish, the sandbox transport — plus the `setup` a fresh clone needs.
#
# NOTE (pixi 0.81): `default-environment` is only accepted on tasks that have a `cmd`. Pure
# aggregators (setup / gates / ci) omit it and resolve their environment through the tasks
# they depend on.

# ── setup ──────────────────────────────────────────────────────────────────────
# One install for the whole Bun workspace: the root package.json declares the members and
# the root bun.lock is the single resolution record. Every turbo task depends on this, so
# `pixi run test` works on a fresh clone — and turbo itself is a workspace dependency, so
# without it there is no orchestrator to run.
bun-install = { cmd = "bun install --frozen-lockfile", description = "Install the Bun workspace from the root lockfile" }
# The SDK itself, editable, with no dependency resolution of its own — the interpreter and
# the libraries are already in this environment. The Python turbo tasks (test, cov) depend
# on this through pixi rather than through a turbo edge, because the install writes into the
# interpreter, not into a package directory turbo can hash.
py-install = { cmd = "python -m pip install --no-deps --editable python/geoquery", description = "Install the geoquery Python SDK in editable mode" }
# Install the git hooks. Run once per clone; `lefthook install` is idempotent.
hooks-install = { cmd = "lefthook install", description = "Install the lefthook git hooks into .git/hooks" }
setup = { description = "Materialise the workspace: bun workspace, Python SDK, git hooks", depends-on = [
  "bun-install",
  "py-install",
  "hooks-install",
] }

# ── repo-wide task graph (turbo) ────────────────────────────────────────────────
# Each reaches turbo through `bun run <script>` in the root package.json, never through a
# `node_modules/.bin` path. `turbo run <task>` fans out to every package that declares that
# script and skips the ones that do not — so `build` compiles the Rust binary and the TS
# workspace, `test` runs nextest, pytest and bun test, `lint` runs clippy + cargo-deny +
# ruff + biome, all under one command and one cache. The `depends-on` here is only what a
# clone needs before turbo can start: the Bun install for turbo itself, and the editable
# Python install for the pytest tasks.
build = { cmd = "bun run all:build", depends-on = [
  "bun-install",
], description = "Build every package that has a build (turbo: Rust release binary + TS workspace)" }
test = { cmd = "bun run all:test", depends-on = [
  "bun-install",
  "py-install",
], description = "Run every package's tests (turbo: Rust nextest + doctests, Python pytest, TS)" }
typecheck = { cmd = "bun run all:typecheck", depends-on = [
  "bun-install",
], description = "Type-check every package that has a typecheck (turbo: cargo check + tsc)" }
lint = { cmd = "bun run all:lint", depends-on = [
  "bun-install",
], description = "Lint every package (turbo: Rust fmt-check/clippy/deny, Python ruff, biome for JS/JSON)" }
cov = { cmd = "bun run all:cov", depends-on = [
  "bun-install",
  "py-install",
], description = "Measure coverage for every package that reports it (turbo: llvm-cov, pytest-cov, bun)" }
fmt = { cmd = "bun run all:fmt", depends-on = [
  "bun-install",
], description = "Rewrite every package with its formatter (turbo: cargo fmt, ruff, biome)" }
# The Rust advisory scan is a package task too (crates/package.json), but it gets its own
# pixi entry point and stays out of `lint`/`gates`: it needs the RustSec advisory database
# over the network, and a gate that fails because rustsec.io was unreachable trains people
# to ignore gates. The release workflow runs it.
advisories = { cmd = "bun run all:advisories", depends-on = [
  "bun-install",
], description = "Check the Rust dependencies against the advisory database (network)" }

# ── versions ───────────────────────────────────────────────────────────────────
# Every publishable surface shares one number. `version-check` is in `gates`, so forgetting
# to bump an npm, PyPI, Cargo, or Conda manifest fails before a commit lands rather than after
# a release.
version = { cmd = "bun \"$PIXI_PROJECT_ROOT/scripts/version.ts\"", depends-on = [
  "bun-install",
], description = "Print the workspace version from the manifest that owns it" }
version-check = { cmd = "bun \"$PIXI_PROJECT_ROOT/scripts/version.ts\" --check", depends-on = [
  "bun-install",
], description = "Assert every release manifest agrees with the workspace version" }
version-set = { cmd = "bun \"$PIXI_PROJECT_ROOT/scripts/version.ts\" --set", depends-on = [
  "bun-install",
], description = "Set the release version in every manifest that owns a literal" }

# ── repo utilities (lefthook + CI share these) ─────────────────────────────────
# The backlog and skills CLIs are installed in the root Bun workspace and invoked through
# `bun x`, which uses Bun instead of the packages' Node shebangs. This keeps the commands
# usable in the restored sandbox, where Bun is the available JavaScript runtime.
backlog = { cmd = "bun x backlog", depends-on = [
  "bun-install",
], description = "Manage the Markdown project backlog", default-environment = "bun" }
skills = { cmd = "bun x skills", depends-on = [
  "bun-install",
], description = "Manage agent skills", default-environment = "bun" }
# Conventional-commit check for the `commit-msg` hook; reads the proposed message from
# stdin (git passes it via {1} in lefthook.yml).
lint-commit = { cmd = "convco check --from-stdin", description = "Validate a commit message against the conventional-commit spec" }
changelog = { cmd = "convco changelog > CHANGELOG.md", description = "Regenerate CHANGELOG.md from conventional commits" }
changelog-preview = { cmd = "convco changelog", description = "Print the changelog convco would write, without writing it" }
# Scans .github/workflows/*.yml by default. Repository-global, so it stays a pixi task and
# is called by `gates` directly rather than through turbo.
lint-actions = { cmd = "actionlint", description = "Lint the GitHub Actions workflows" }
# The sandbox publish plan is a wire format shared with the publisher, so a malformed bundle
# must fail a gate rather than a push to the orphan branch. NOT part of `lint`: `pixi-sandbox`
# is not a conda dependency, so a local `pixi run lint` would fail on a missing binary rather
# than on a real finding. CI installs it with the SHA-pinned setup action and calls this task
# as its own step.
lint-sandbox-plan = { cmd = "pixi-sandbox plan --config .pixi-sandbox.toml", description = "Validate the reviewed sandbox publish plan" }

# ── release artifacts ──────────────────────────────────────────────────────────
# `pixi publish` builds every package with `publish = true` — geoquery-cli (this manifest)
# and the Python SDK. `--dry-run` still resolves the full publish set, which is why it is a
# gate: it fails on a package whose build dependencies do not solve, before anything uploads.
publish-plan = { cmd = "pixi publish --dry-run", description = "Resolve and print the publish set without building or uploading" }
publish-dist = { cmd = "pixi publish --target-dir dist", description = "Build the publishable packages into dist/" }
# The Python task makes platform-native wheel artifacts with the locked maturin backend.
# The TypeScript task compiles the client with Bun; npm packs that prepared directory only
# in the release job because npm is required there for its OIDC Trusted Publishing implementation.
py-dist = { cmd = "bun run dist", cwd = "python/geoquery", depends-on = [
  "bun-install",
], description = "Build the Python sdist and wheel into dist/pypi" }
client-dist = { cmd = "bun run build", cwd = "packages/client", depends-on = [
  "bun-install",
], description = "Build the TypeScript client distribution directory" }

# ── documentation site (astro + starlight) ─────────────────────────────────────
# `apps/docs` is built by `turbo run build` along with everything else; these tasks exist
# for the two things turbo is the wrong tool for — a dev server, and a Pages build that has
# to be one line in a workflow. GEOQUERY_VERSION is exported rather than written into the
# site: `scripts/version.ts` reads it from the one manifest that owns the number.
docs-dev = { cmd = "GEOQUERY_VERSION=\"$(bun \"$PIXI_PROJECT_ROOT/scripts/version.ts\")\" bun run dev", cwd = "apps/docs", depends-on = [
  "bun-install",
], description = "Serve the documentation site with hot reload" }
docs-build = { cmd = "GEOQUERY_VERSION=\"$(bun \"$PIXI_PROJECT_ROOT/scripts/version.ts\")\" bun run build", cwd = "apps/docs", depends-on = [
  "bun-install",
], description = "Build the documentation site into apps/docs/dist" }
docs-preview = { cmd = "bun run preview", cwd = "apps/docs", depends-on = [
  "docs-build",
], description = "Serve the built documentation site as Pages will" }

# ── sandbox transport (pixi-sandbox) ───────────────────────────────────────────
# pack -> doctor -> publish, locally. `pixi-sandbox` is not a conda dependency; it is a
# static release binary, installed by the checksum-verified one-liner in its README. See
# the header of this file and .pixi-sandbox.toml for why the transport vendors the crates.
sandbox-pack = { cmd = "pixi-sandbox pack --repo-root . --envs default --output-dir .sandbox-out --platform linux-64 --fetch-tools --cargo-vendor --self-bin $SANDBOX_SELF_BIN", description = "Pack the offline sandbox transport" }
sandbox-doctor = { cmd = "pixi-sandbox doctor --branch-location .sandbox-out --verify", description = "Verify a packed transport without writing anything" }
sandbox-publish = { cmd = "pixi-sandbox publish --input-dir .sandbox-out --branch-name sandbox/developer-linux-64 --remote origin", description = "Publish the transport to its orphan branch" }
sandbox-restore = { cmd = "bash scripts/restore.sh", description = "Restore the offline sandbox from its orphan branch" }

# ── gates ──────────────────────────────────────────────────────────────────────
# One command for "what CI will run". The package-specific checks are now three turbo
# invocations (`lint`, `typecheck`, `test`) that fan out across every language; the rest are
# the repository-global checks that have no package to belong to. `advisories` is the
# deliberate omission — it needs the network (see its note above).
gates = { description = "Every check that must pass before a commit lands", depends-on = [
  "lint",
  "typecheck",
  "test",
  "version-check",
  "lint-actions",
  "publish-plan",
] }
# `gates` plus the built artefacts. `build` (turbo) covers the Rust binary and the TS
# workspace; `publish-dist` proves the conda packages a user installs still build.
ci = { description = "`gates` plus the built artefacts", depends-on = [
  "gates",
  "build",
  "publish-dist",
] }
