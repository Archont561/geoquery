# geoquery — THE workspace manifest.
#
# This file is the environment. Four feature layers, one environment, one lockfile:
#
#   rust     the toolchain the engine will be built with: rust, cargo-nextest,
#            cargo-llvm-cov, cargo-deny
#   js       bun, the only JavaScript runtime here
#   python   the interpreter and the whole SDK toolchain: pytest, pytest-cov, ruff,
#            hatchling, pip, httpx, pydantic
#   utils    the repository's own instruments: convco, lefthook, actionlint
#
# The layers exist so a version bump to one toolchain is its own reviewable diff, and
# so `default` (all four) is a deliberate statement rather than an accident of
# whatever was last added.
#
# The toolchain is pinned rather than inherited. `pixi.lock` records the exact compiler
# the CLI is built and gated with, so a contributor's rustup version cannot decide whether
# `pixi run gates` passes. That mattered before there was Rust source and matters more
# now that there is: a dependency that needs a newer rustc than the lockfile names fails
# in CI and nowhere else.
#
# There is no Node.js anywhere in this manifest. `bun` is the only JavaScript runtime,
# and it carries the JS toolchain (turbo, biome) as workspace packages rather than
# conda dependencies: conda-forge has no `turbo` (verified against the channel), and
# `biome` is resolved from `package.json` so one lockfile decides both the linter and
# the version its `biome.json` schema names. Tasks therefore reach the JS toolchain
# through `bun x` / `bun run`, never through a `node_modules/.bin` path — those entries
# carry a `node` shebang, which no environment here provides.
#
# The Python toolchain lives *in* the environment rather than in a venv: conda-forge
# carries the interpreter, pip, pytest, ruff, hatchling, httpx and pydantic, so the SDK's
# whole toolchain is one `pixi.lock`. `py-install` therefore installs the package with
# `--no-deps` — the dependencies are already solved, and letting pip resolve them a
# second time would give the SDK a version of pydantic the lockfile does not know
# about. It is `python -m pip`, not `pip`: PATH is not trustworthy inside a task (see the
# opencode-install note), and conda-forge's interpreter is the one that must run it.
#
# `maturin` and the PyO3 bindings are deliberately absent. The Python SDK talks to the
# HTTP API first (interfaces/python.md); a native binding is a Phase 6 decision, and a
# 30 MB build backend in `pixi.lock` before anything uses it is a cost paid by every
# sandbox restore for nothing.
#
# `convco`, `lefthook` and `actionlint` are conda dependencies, not npm ones: the git
# hooks must work on a machine restored from the sandbox branch, and
# `scripts/restore.sh` puts a restored `default` environment's `bin/` on PATH but no
# `node_modules`.
#
# Divergence from .knowledge: the KB describes `cargo xtask ci` as the local CI
# reproduction, and describes the task runner as part of the repository. Here pixi is
# the task runner, because pixi is what the hooks and the workflows call and there is
# no reason for a second entry point over the same commands. `xtask` will exist for
# one job only — code generation, which needs the workspace's own types in memory.
#
# Pins (verified 2026-09-30): rust 1.98.x, bun 1.3.x, python 3.13.x, convco 0.7.x,
# lefthook 2.1.x, actionlint 1.7.x (conda-forge). Adding a pin means one `pixi lock` to
# refresh pixi.lock — `pixi install --locked` in CI and the devcontainer fails until that
# lands. See .knowledge/ for the architecture these layers serve.

[workspace]
name = "geoquery"
version = "0.1.0"
description = "One protocol-independent query language and execution engine for federating geospatial resources and services"
authors = ["Archont561 <142521648+Archont561@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Archont561/geoquery"
repository = "https://github.com/Archont561/geoquery"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.81.0"
# `pixi-build` is what lets a sub-manifest carry a `[package]` table, i.e. what lets
# `[package]` below and `python/geoquery/pixi.toml` describe the conda packages that
# `pixi publish` builds. It is a preview flag, so it is opted into here, in the one
# manifest that owns the workspace — opting in per package would mean a workspace whose
# members disagree about whether building is allowed.
preview = ["pixi-build"]

# One place to bump a version; the tables below opt in with { workspace = true }. The
# npm and PyPI manifests are checked against this number by `pixi run version-check`,
# which is in the `gates` aggregator — three manifests edited by hand is three chances
# to forget, and a published artefact with the wrong version is a bug nobody reports.
[workspace.dependencies]
rust = ">=1.98.1,<1.99"
bun = ">=1.3.11,<2"
python = ">=3.13,<3.14"
pytest = ">=8.4,<9"
pytest-asyncio = ">=1.2,<2"
pytest-cov = ">=6,<7"
ruff = ">=0.14,<0.15"
hatchling = ">=1.27,<2"
pip = ">=26,<27"
httpx = ">=0.28,<0.29"
pydantic = ">=2.12,<3"
convco = ">=0.7.2,<0.8"
lefthook = ">=2.1.15,<3"
actionlint = ">=1.7.12,<2"

# ── feature layers ────────────────────────────────────────────────────────────
# `default` carries all four; the layers exist so each toolchain's version bump is its
# own diff, and so a consumer who only wants one runtime does not drag the others in.

[feature.rust.dependencies]
# The toolchain the engine is built and gated with.
#
# `cargo-nextest`, `cargo-llvm-cov` and `cargo-deny` are conda-forge packages rather
# than `cargo install` invocations: a `cargo install` binary is built from source into
# ~/.cargo/bin on every fresh clone and on every devcontainer, and it is absent from
# the published sandbox branch, so a restored airlock could not run the same gates the
# developer ran. As conda dependencies they travel with `pixi.lock` in the `default`
# environment that `.pixi-sandbox.toml` packs.
#
# No `maturin` and no `cross` yet, for the same reason as their absence from the Python
# layer: a toolchain nobody has invoked is a download every restore pays for.
rust = { workspace = true }
cargo-nextest = ">=0.9.144,<0.10"
cargo-llvm-cov = ">=0.9.1,<0.10"
cargo-deny = ">=0.20.2,<0.21"

[feature.js.dependencies]
# The only JavaScript runtime in the project.
bun = { workspace = true }

[feature.python.dependencies]
# The interpreter and the whole SDK toolchain, from one lockfile. `pytest-asyncio`
# because the SDK's transport is async httpx, so the tests are.
python = { workspace = true }
pytest = { workspace = true }
pytest-asyncio = { workspace = true }
# pytest-cov rather than `coverage` alone: it is the same coverage.py, wired into the
# runner the suite already uses, so `pixi run coverage-py` is one command instead of a
# `coverage run` wrapper that has to know where the sources are.
pytest-cov = { workspace = true }
ruff = { workspace = true }
hatchling = { workspace = true }
# pip because `py-install` edits this package into the interpreter: an editable install
# is a build, and without a build backend in the environment it would either download one
# into a temporary venv or refuse. `python -m pip` with nothing to install into is the
# failure this dependency exists to prevent.
pip = { workspace = true }
httpx = { workspace = true }
pydantic = { workspace = true }

[feature.utils.dependencies]
# Repo utilities shared by the git hooks and CI, so the two cannot drift.
#   convco     — conventional-commit check (commit-msg hook) + CHANGELOG.md
#   lefthook   — the hooks themselves; every hook delegates to a task below
#   actionlint — the GitHub Actions linter
convco = { workspace = true }
lefthook = { workspace = true }
actionlint = { workspace = true }

[environments]
# `default` is pixi's implicit environment, so a task runs as `pixi run <task>`:
# no `-e` flag in a shell, a git hook or a workflow step.
default = { features = [
  "rust",
  "js",
  "python",
  "utils",
] }

# ---------------------------------------------------------------------------
# Tasks. Everything a human, a git hook or a CI job does is one of these, so a
# GitHub Actions step can be a single line: `pixi run <task>`. Logic lives here
# (reviewable, runnable locally), not in workflow YAML.
#
# There is one environment, so unlike repos with several there is no `-e` to
# disambiguate: a task name says which side it is on. `*-js` is the TypeScript
# workspace, `*-py` is the Python SDK, and the unadorned verbs are the ones a
# contributor reaches for most often.
#
# NOTE (pixi 0.81): `default-environment` is only accepted on tasks that have a
# `cmd`. Pure aggregators (fmt / lint / gates / ci) omit it.
# ---------------------------------------------------------------------------

# The `[package]` table below makes this manifest two things at once: the pixi workspace
# root that owns the environment, and the `geoquery-cli` conda package that `pixi publish`
# builds. That is a deliberate merge, and it is forced by the same constraint that shapes
# `Cargo.toml`: `pixi-build-rust` runs `cargo install --locked --path <dir>`, and `cargo
# install` cannot install from a virtual manifest. The package's source directory is the
# directory holding its manifest, so the manifest has to sit beside the Cargo manifest that
# is also the package's. Keeping the package in a sub-manifest would mean the conda build
# ran from a directory that is not a Cargo package, and `pixi-build-rust` would have nothing
# to install.
#
# `[package.version]` is inherited from `[workspace].version` for the same reason the Cargo
# manifests are: `version-check` asserts every surface agrees, and it is a good deal easier
# to assert that than to maintain.

[package]
# The package name is not the crate name. `geoquery-cli` as a package installs the
# binary `geoquery`, and the distinction matters on a channel where a user searching
# for "geoquery" should find the library packages too.
name = "geoquery-cli"
# The root pixi.toml is the version authority for every published surface. This table
# inherits rather than restating it: `pixi run version-check` walks the manifests and
# fails on a literal, so the two cannot drift.
version = { workspace = true }
# The opt-in `pixi publish` looks for. Without it this package is buildable with
# `pixi build --path .` and invisible to a workspace-wide publish.
publish = true
license = "MIT OR Apache-2.0"
description = "Command-line client for geoquery"
readme = "crates/README.md"
repository = "https://github.com/Archont561/geoquery"
homepage = "https://github.com/Archont561/geoquery"

[package.build]
# pixi-build-rust runs `cargo install --locked --path . --root $PREFIX`, so the crate
# must be self-contained and carry its own Cargo.lock — it does, at the Cargo.lock
# beside this manifest, because this directory is the Cargo workspace root too.
backend = { name = "pixi-build-rust", version = ">=0.5,<0.6", channels = [
  "https://prefix.dev/conda-forge",
] }

[package.build.config]
# Only the C compiler. The backend defaults to `["rust", "c"]`, and the "rust" entry
# asks conda-forge's compiler infrastructure for `rust_linux-64` — a package that then
# requires the `rust` metapackage, which no longer exists: on conda-forge `rust` *is*
# the platform package (a 165 MB linux-64 artefact that already depends on
# gcc_impl_linux-64). Asking for both is an unsolvable environment, and the failure is
# a wall of "rust 1.xx.* for which no candidates were found" rather than a message about
# the compiler. The C entry is what supplies the linker; the toolchain comes from the
# pinned `rust` build dependency below.
compilers = ["c"]

# One binary, named explicitly. An empty list installs whatever cargo thinks a package
# produces, which is a decision made by a file that a later `src/bin/` would change
# silently.
binaries = ["geoquery"]
# `cargo install` already builds release; the profile lives in the root Cargo.toml where
# rustc reads it from, not here.
extra-args = []

[package.build-dependencies]
# The backend adds rust and cargo itself; pinning the compiler here is what makes a
# released binary reproducible across the years between this commit and the next one.
# Keep the bound in step with `rust` in [feature.rust.dependencies] below.
rust = ">=1.98.1,<1.99"

# No [package.host-dependencies] and no [package.run-dependencies]: the binary links
# the C runtime and nothing else. Declaring `libgcc-ng` or `openssl` here would be a
# promise to keep them in step with what the toolchain actually links.

[tasks]

# ── setup ────────────────────────────────────────────────────────────────────
# One install for the whole Bun workspace: the root package.json declares
# `workspaces: ["packages/*", "apps/*"]`, so members carry no lockfile of their own
# and the root bun.lock is the single resolution record. Every JS task depends on
# this, so `pixi run test` works on a fresh clone.
bun-install = { cmd = "bun install --frozen-lockfile", description = "Install the Bun workspace from the root lockfile" }
# The SDK itself, editable, with no dependency resolution of its own — the interpreter
# and the libraries are already in this environment (see the manifest header).
py-install = { cmd = "python -m pip install --no-deps --editable python/geoquery", description = "Install the geoquery Python SDK in editable mode" }
# Install the git hooks. Run once per clone; `lefthook install` is idempotent and
# writes .git/hooks/*, which is not tracked.
hooks-install = { cmd = "lefthook install", description = "Install the lefthook git hooks into .git/hooks" }
# Everything a fresh clone needs, in the order the steps depend on each other.
setup = { description = "Materialise the workspace: bun workspace, Python SDK, git hooks", depends-on = [
  "bun-install",
  "py-install",
  "hooks-install",
] }

# ── Rust ──────────────────────────────────────────────────────────────────────
# Every cargo command runs in `crates/`, which is the root of the Cargo workspace and,
# for the reason recorded in Cargo.toml, also the directory the conda package is
# built from. `--workspace` is explicit in the test and coverage tasks so a crate added
# later is covered by the gate that exists today rather than by one someone remembers
# to write.
#
# `cargo build --release` is what `cargo install` does inside the package build, so the
# artefact this produces is the same binary that ships. The binary is `geoquery`, from
# `[[bin]]` in Cargo.toml.
build-rs = { cmd = "cargo build --release", description = "Build the CLI binary in release mode" }
fmt-rs = { cmd = "cargo fmt --all", description = "Rewrite the Rust sources with rustfmt" }
fmt-check-rs = { cmd = "cargo fmt --all --check", description = "Check Rust formatting without writing" }
# `--workspace` is load-bearing, not decoration. The root `Cargo.toml` is a package *and*
# the workspace root, so a bare `cargo clippy` run from `crates/` selects the root package
# — geoquery-cli and core — and quietly lints neither of the other seven crates. The same
# is true of `cargo build`, which is why `build-rs` stays unadorned on purpose: it is
# meant to produce the one binary the package ships, not to check the workspace.
clippy = { cmd = "cargo clippy --workspace --all-targets --all-features -- -D warnings", description = "Lint every Rust crate, treating warnings as errors" }
test-rs = { cmd = "cargo nextest run --workspace", description = "Run the Rust test suites with nextest" }
test-doc-rs = { cmd = "cargo test --doc --workspace", description = "Run the Rust documentation tests" }
coverage = { cmd = "cargo llvm-cov nextest --workspace --lcov --output-path target/lcov.info", description = "Measure test coverage with cargo-llvm-cov" }
# Bans, licences and sources from deny.toml. Not advisories: `deny-advisories` needs the
# advisory database, and a gate that fails because rustsec.io was unreachable is a gate
# that trains people to ignore gates. The release workflow runs it separately.
# `--workspace` is load-bearing for the same reason it is on `clippy`: `crates/` holds a
# package, so without it cargo-deny roots the graph at geoquery-cli and checks 55 crates
# instead of 435 — a licence policy over a graph it silently truncated, which is worse
# than no policy because it reports success. `--locked` asserts the check ran against the
# committed lockfile, so a policy pass means the artefact a release would build.
#
# `--exclude-unpublished` is deliberately NOT passed. Every member is `publish = false`
# today (they ship as one conda package, not as crates.io crates), and that flag would
# exclude every one of them from the graph roots — the exact truncation above, requested.
#
# The flags go *before* the subcommand. `cargo deny check --workspace` is an error even
# though `--workspace` appears in `cargo deny check --help`, because it is a global
# option; the same is true of `--locked`.
deny = { cmd = "cargo deny --workspace --locked check bans licenses sources", description = "Check the Rust dependency policy over the whole workspace" }
deny-advisories = { cmd = "cargo deny --workspace --locked check advisories", description = "Check the Rust dependencies against the advisory database" }

# ── publishing (conda packages) ───────────────────────────────────────────────
# `pixi publish` builds every package with `publish = true` — today that is
# this manifest's geoquery-cli and `python/geoquery/pixi.toml`'s geoquery — and then
# either uploads the artefacts or copies them out. The tasks below are the first two
# points in that pipeline: the third is `pixi publish --channel <name>`, which needs a
# token, so it belongs in the release workflow rather than in a task anyone can run by
# accident.
#
# `--dry-run` still resolves the full publish set, which is why it is a gate: it fails on
# a package whose build dependencies do not solve, before anything is uploaded anywhere.
publish-plan = { cmd = "pixi publish --dry-run", description = "Resolve and print the publish set without building or uploading" }
# Builds the artefacts into dist/ with no channel involved: the release rehearsal, and
# the step CI runs to prove the package still builds.
publish-dist = { cmd = "pixi publish --target-dir dist", description = "Build the publishable packages into dist/" }

# ── TypeScript workspace (turbo) ──────────────────────────────────────────────
# `turbo run <task>` is the orchestrator: it topologically orders the workspace from
# `dependsOn` in turbo.json and caches by input hash. The root package.json owns
# these verbs, so `bun run build` at the root and `pixi run build` are the same
# command.
build = { cmd = "bun run build", depends-on = [
  "bun-install",
], description = "Build every TypeScript workspace package (turbo)" }
test = { cmd = "bun run test", depends-on = [
  "bun-install",
], description = "Run the TypeScript test suites (turbo)" }
typecheck = { cmd = "bun run typecheck", depends-on = [
  "bun-install",
], description = "Type-check every TypeScript workspace package (turbo)" }

# ── documentation site (astro + starlight) ───────────────────────────────────
# `apps/docs` is a member of the same Bun workspace as `packages/*`, so the install is
# the root one and the site has no lockfile of its own. `turbo run build` therefore
# builds it along with everything else; these tasks exist for the two things turbo is
# the wrong tool for — a dev server, and a Pages build that has to be one line in a
# workflow.
#
# GEOQUERY_VERSION is exported rather than written into the site: the documented version
# is decided by the environment that built it, and `scripts/version.ts` reads it from the
# one manifest that owns the number. A build started outside these tasks still shows the
# real version — `astro.config.mjs` falls back to the same module — so the variable is a
# shortcut, not a requirement.
docs-dev = { cmd = "GEOQUERY_VERSION=\"$(bun \"$PIXI_PROJECT_ROOT/scripts/version.ts\")\" bun run dev", cwd = "apps/docs", depends-on = [
  "bun-install",
], description = "Serve the documentation site with hot reload" }
docs-build = { cmd = "GEOQUERY_VERSION=\"$(bun \"$PIXI_PROJECT_ROOT/scripts/version.ts\")\" bun run build", cwd = "apps/docs", depends-on = [
  "bun-install",
], description = "Build the documentation site into apps/docs/dist" }
docs-preview = { cmd = "bun run preview", cwd = "apps/docs", depends-on = [
  "docs-build",
], description = "Serve the built documentation site as Pages will" }

# ── Biome ────────────────────────────────────────────────────────────────────
# Resolved from the Bun workspace, not from conda-forge: biome.json's `$schema`
# names the exact version, and one lockfile then decides both the config and the
# binary that reads it. `biome check` is format + lint + import sorting in one pass;
# `check --write` is what the pre-commit hook runs, so a hook fixes what it can
# instead of only reporting.
lint-js = { cmd = "bun run lint", depends-on = [
  "bun-install",
], description = "Format-check and lint the TypeScript workspace (biome)" }
# `biome check --write`, not `biome format --write`: the pre-commit hook promises to fix
# what the linter reports, and format alone cannot fix an import-order assist or any other
# safe lint fix. A hook that reports a finding it has no way to repair trains people to
# ignore the hook. Safe fixes only — an unsafe fix changes behaviour and stays a decision
# for a person.
fix-js = { cmd = "bun run format", depends-on = [
  "bun-install",
], description = "Rewrite the TypeScript workspace with biome (format and safe fixes)" }

# ── Python SDK ───────────────────────────────────────────────────────────────
# ruff check and ruff format are one binary, so it answers to the same two verbs as
# biome above rather than introducing `lint`/`format` names of its own.
lint-py = { cmd = "ruff check python/geoquery", description = "Lint the Python SDK (ruff)" }
fix-py = { cmd = "ruff check --fix python/geoquery && ruff format python/geoquery", description = "Rewrite the Python SDK with ruff" }
fmt-check-py = { cmd = "ruff format --check python/geoquery", description = "Check Python formatting without writing" }
test-py = { cmd = "pytest", depends-on = [
  "py-install",
], description = "Run the Python SDK test suite" }
# `--cov=geoquery` rather than `--cov=python/geoquery/src/geoquery`: the importable name
# is the one the installed package has, and measuring the path would report on files the
# SDK does not import by that name. `term-missing` because a percentage with no column is
# a percentage nobody acts on. The XML lands beside the package that produced it, not at
# the repository root, so the ignored artefact is found next to what makes it stale.
coverage-py = { cmd = "pytest --cov=geoquery --cov-report=term-missing --cov-report=xml:python/geoquery/coverage.xml", depends-on = [
  "py-install",
], description = "Measure the Python SDK's test coverage" }

# ── versions ─────────────────────────────────────────────────────────────────
# Two published surfaces, one number. `pixi run version-check` is in `gates`, so
# forgetting to bump the npm or PyPI manifest fails before a commit lands rather than
# after a release.
version = { cmd = "bun \"$PIXI_PROJECT_ROOT/scripts/version.ts\"", depends-on = [
  "bun-install",
], description = "Print the workspace version from the manifest that owns it" }
version-check = { cmd = "bun \"$PIXI_PROJECT_ROOT/scripts/version.ts\" --check", depends-on = [
  "bun-install",
], description = "Assert the npm and Python manifests agree with the workspace version" }

# ── repo utilities (lefthook + CI share these) ───────────────────────────────
# Conventional-commit check for the `commit-msg` hook; reads the proposed message
# from stdin (git passes it via {1} in lefthook.yml).
lint-commit = { cmd = "convco check --from-stdin", description = "Validate a commit message against the conventional-commit spec" }
# Changelog from the same commit history, so the two cannot disagree.
changelog = { cmd = "convco changelog > CHANGELOG.md", description = "Regenerate CHANGELOG.md from conventional commits" }
changelog-preview = { cmd = "convco changelog", description = "Print the changelog convco would write, without writing it" }
# Scans .github/workflows/*.yml by default.
lint-actions = { cmd = "actionlint", description = "Lint the GitHub Actions workflows" }
# The sandbox publish plan is a wire format shared with the publisher, so a malformed
# bundle must fail a gate rather than a push to the orphan branch.
# NOT part of the `lint` aggregator: `pixi-sandbox` is not a conda dependency (see
# the sandbox block below), so a local `pixi run lint` would fail on a missing binary
# rather than on a real finding. CI installs it with the SHA-pinned setup action and
# calls this task as its own step.
lint-sandbox-plan = { cmd = "pixi-sandbox plan --config .pixi-sandbox.toml", description = "Validate the reviewed sandbox publish plan" }

# ── agent tooling ────────────────────────────────────────────────────────────
# opencode is installed globally with bun, not as a conda dependency, so it is on
# PATH outside a task too and the published sandbox branch stays free of a ~185 MB
# blob it would only carry for a developer tool. `bun pm bin -g` follows
# $BUN_INSTALL rather than a hardcoded path, and that directory is on nobody's PATH,
# so the binary is linked into one that is — /usr/local/bin first (the devcontainer
# user may write it), ~/.local/bin second. When neither is writable the install still
# succeeded, so report where it landed rather than failing a container over a $PATH
# detail.
opencode-install = 'BUN_BIN="$(bun pm bin -g)" && bun add -g opencode-ai@latest && (ln -sfn "$BUN_BIN/opencode" /usr/local/bin/opencode 2>/dev/null || (mkdir -p "$HOME/.local/bin" 2>/dev/null && ln -sfn "$BUN_BIN/opencode" "$HOME/.local/bin/opencode" 2>/dev/null) || echo "opencode installed to $BUN_BIN, which is not on PATH: neither /usr/local/bin nor ~/.local/bin is writable")'
# The model catalogue is a separate cache (~/.cache/opencode/models.json, rebuilt
# from models.dev) and a binary upgrade does not invalidate it, so refreshing is a
# separate step.
setup-opencode = { depends-on = [
  "opencode-install",
], cmd = "\"$(bun pm bin -g)/opencode\" models --refresh" }

# ── sandbox transport (pixi-sandbox) ─────────────────────────────────────────
# pack → doctor → publish, locally. These exercise the installed pixi-sandbox binary
# directly, so a local run and the generated CI workflow share the exact command
# surface. The branch name must match the reviewed plan (`pixi run
# lint-sandbox-plan`) or this publishes a transport that `scripts/restore.sh` will
# never look for.
#
# `pixi-sandbox` is not a conda dependency: it is a static release binary, installed
# by the checksum-verified one-liner in its README:
#
#   curl -fsSL https://github.com/Archont561/pixi-sandbox/releases/download/v0.3.2/install.sh | sh
#
# which also runs `init github`. That generator writes restore.sh / restore.ps1 to
# the project root; they live in scripts/ here, so regenerate with
# `pixi-sandbox init github` and move them rather than running the one-liner blind.
#
# Pixi tasks have no `${VAR:-default}` — a plain `$VAR` expands and a missing value
# expands to an empty string — so `SANDBOX_SELF_BIN` is the caller's to set, pointing
# at a static build of the binary:
#
#   SANDBOX_SELF_BIN=~/pixi-sandbox-x86_64-unknown-linux-musl pixi run sandbox-pack
# `--cargo-vendor` matches `cargo_vendor = true` in `.pixi-sandbox.toml`; the flag and the
# setting are the same decision stated twice, and a disagreement between them packs a
# transport that quietly lacks the crate sources. The manifest is at the repository root
# now, which is what makes vendoring possible at all.
sandbox-pack = { cmd = "pixi-sandbox pack --repo-root . --envs default --output-dir .sandbox-out --platform linux-64 --fetch-tools --cargo-vendor --self-bin $SANDBOX_SELF_BIN", description = "Pack the offline sandbox transport" }
sandbox-doctor = { cmd = "pixi-sandbox doctor --branch-location .sandbox-out --verify", description = "Verify a packed transport without writing anything" }
sandbox-publish = { cmd = "pixi-sandbox publish --input-dir .sandbox-out --branch-name sandbox/developer-linux-64 --remote origin", description = "Publish the transport to its orphan branch" }
# One-liner offline reconstruction from the orphan branch, with PATH aliases.
# It lives outside pixi on purpose: the point is that pixi need not be installed
# on the airlocked machine that runs it.
sandbox-restore = { cmd = "bash scripts/restore.sh", description = "Restore the offline sandbox from its orphan branch" }

# ── gates ────────────────────────────────────────────────────────────────────
# One command for "what CI will run". Aggregators resolve their environment through
# the tasks they depend on (pixi 0.81: `default-environment` needs a `cmd`, and
# these have none).
#
# `lint` already carries the Rust half (`fmt-check-rs`, `clippy`, `deny`), so `gates`
# does not repeat it. `deny-advisories` is the exception: it needs the advisory database,
# so it stays out of the gate that every commit passes and the release workflow runs it.
fmt = { depends-on = ["fmt-rs", "fix-js", "fix-py"] }
lint = { depends-on = [
  "fmt-check-rs",
  "clippy",
  "deny",
  "lint-js",
  "lint-py",
  "fmt-check-py",
  "lint-actions",
  "version-check",
] }
gates = { description = "Every check that must pass before a commit lands", depends-on = [
  "lint",
  "test",
  "test-rs",
  "test-doc-rs",
  "typecheck",
  "test-py",
  "publish-plan",
] }
# `publish-dist` rather than `build-rs` for the Rust artefact: building with cargo proves
# the code compiles, building with `pixi publish` proves the package a user installs is
# one this repository can actually produce — the backend, the compiler pin, the binary
# name and the conda metadata all have to hold for that step to finish.
ci = { description = "`gates` plus the built artefacts", depends-on = [
  "gates",
  "build",
  "build-rs",
  "publish-dist",
] }
