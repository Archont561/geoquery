[build-system]
# maturin builds the PyO3 extension and packages the thin Python namespace in one wheel.
# The Rust extension is the native API; there is no HTTP client dependency in this package.
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "geoquery-sdk"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Native Python bindings for geoquery"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Archont561", email = "142521648+Archont561@users.noreply.github.com" }]
keywords = ["geospatial", "stac", "ogc", "query", "gis", "pyo3", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Archont561/geoquery"
Repository = "https://github.com/Archont561/geoquery"

[tool.maturin]
# The extension is a crate under `crates/`, not a directory inside this package: an FFI
# adapter has no more reason to live in a Python package than the engine it binds has, and
# from here it is in the same lockfile and under the same lint policy as every other crate.
# maturin still owns the wheel build, which is why this path is all that crosses over.
manifest-path = "../../crates/python-native/Cargo.toml"
python-source = "src"
module-name = "geoquery._native"
bindings = "pyo3"
# Turns on `pyo3/extension-module` for this build only. See the comment on that feature in
# `crates/python-native/Cargo.toml`: the wheel is the one artifact that must *not* link
# libpython, and it is the one build that runs outside `cargo test`.
features = ["extension-module"]
strip = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "D203",
  "D213",
  "ISC001",
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "INP001", "PLR2004"]
"src/geoquery/__init__.py" = ["A005"]

[tool.ruff.format]
docstring-code-format = true

[tool.hypothesis]
# Deadline off because every example in this suite crosses a C ABI twice, and a loaded CI
# runner can spend longer on one example than the default 200 ms without anything being
# wrong. `max_examples` bounds the work instead, which is deterministic rather than a
# function of how busy the machine is — a suite whose total time depends on the runner is a
# suite that gets its deadline raised until it is not checked at all.
max_examples = 100

[tool.pytest.ini_options]
testpaths = ["python/geoquery/tests"]
pythonpath = ["python/geoquery/src"]
asyncio_mode = "auto"
