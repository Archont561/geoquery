[build-system]
# maturin builds the PyO3 extension and packages the thin Python namespace in one wheel.
# The Rust extension is the native API; there is no HTTP client dependency in this package.
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "geoquery-sdk"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Native Python bindings for geoquery"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Archont561", email = "142521648+Archont561@users.noreply.github.com" }]
keywords = ["geospatial", "stac", "ogc", "query", "gis", "pyo3", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Archont561/geoquery"
Repository = "https://github.com/Archont561/geoquery"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "geoquery._native"
bindings = "pyo3"
strip = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "D203",
  "D213",
  "ISC001",
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "INP001", "PLR2004"]
"src/geoquery/__init__.py" = ["A005"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["python/geoquery/tests"]
pythonpath = ["python/geoquery/src"]
asyncio_mode = "auto"
