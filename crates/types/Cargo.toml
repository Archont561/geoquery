[package]
name = "geoquery-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The geoquery data model: the canonical query AST, descriptors and results"
keywords = ["geospatial", "stac", "ogc", "query", "gis"]
categories = ["science::geo"]
# Published because `geoquery-core` is, and the adapter contracts core exposes are
# written in these types: a `ServiceAdapter` takes a `GeoQuery` and returns
# `GeoResult`s. A crate cannot be published with a dependency that is not, so the
# moment core named this one, this one joined the release. GQ-2 and GQ-3 are what
# made that safe: the query AST is settled, which is the bar the other internal
# crates have not cleared yet.
publish = ["crates-io"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
geojson = { workspace = true }
thiserror = { workspace = true }
# The TypeScript surface is derived, not written: `xtask codegen` reads these
# annotations and emits `packages/geoquery/src/generated`.
ts-rs = { workspace = true }


[dev-dependencies]
pretty_assertions = { workspace = true }
# Also a normal dependency. Declared again so the integration tests can read back the
# TypeScript the derives will emit, which is the only way to check the hand-written
# overrides against the Rust types they stand for.
ts-rs = { workspace = true }
