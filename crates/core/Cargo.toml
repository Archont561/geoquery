[package]
name = "geoquery-core"
# This crate is the query *language*: its version is the protocol version a service has
# to speak to understand it, which is why the CLI reports it separately from its own. It
# inherits that version from `[workspace.package]` in `../Cargo.toml` like every other
# member, and `pixi run version-check` fails if a crate here ever restates it — the
# authority is the root pixi.toml and the hop through Cargo is checked, not assumed.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The geoquery query language: documents, and the rules that make them valid"
keywords = ["geospatial", "stac", "ogc", "query", "gis"]
categories = ["science::geo"]
# `geoquery-cli` is published to crates.io, so this dependency must be available there
# first. Other workspace crates stay internal until they have a stable public contract.
publish = ["crates-io"]

[dependencies]
# serde_json brings serde with it; nothing here names serde directly, so nothing here
# names it directly. The bound lives in one place for the whole workspace.
serde_json = { workspace = true }

[dev-dependencies]
# The tests live in `tests/`, one file per module in `src/`, so they link the crate the
# way a dependent does and reach nothing a dependent cannot. That is what makes serde_json
# a dev-dependency as well as a dependency: `json!` is used to write the expected values,
# and an integration test does not inherit the crate's own dependency list.
serde_json = { workspace = true }

[lints]
workspace = true
