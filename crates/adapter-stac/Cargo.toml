[package]
name = "geoquery-adapter-stac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "STAC adapter: capabilities, search and fetching as a geoquery source"
keywords = ["geospatial", "stac", "query", "gis"]
categories = ["science::geo"]
# `geoquery` (the CLI, published to crates.io) depends on this crate directly as of
# Phase 1's live STAC execution path, so it must be publishable too — a published crate
# cannot depend on one that is not. `geoquery-adapter-ogc` and `geoquery-adapter-native`
# stay `publish = false`: they remain unimplemented scaffolding nothing published reaches.
publish = ["crates-io"]

[lints]
workspace = true

[dependencies]
geoquery-types = { workspace = true }
geoquery-core = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
geo-types = { workspace = true }
geojson = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }


[dev-dependencies]
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
