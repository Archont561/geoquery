[package]
name = "geoquery-node-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "N-API transport adapter for the @archont561/geoquery TypeScript package"
publish = false

[lib]
# `rlib` as well as `cdylib`: the rlib is what makes this crate testable from Rust and
# lintable by the ordinary workspace tooling, and a cdylib alone is only loadable by a
# JavaScript runtime. `crate-type` decides what cargo links, not what the tests reach.
crate-type = ["cdylib", "rlib"]

[dependencies]
geoquery-engine.workspace = true
napi.workspace = true
napi-derive.workspace = true

[build-dependencies]
napi-build.workspace = true

# The one crate in the workspace that does not inherit `[workspace.lints]`, and the reason
# is the first key below. Every other member opts in; this one restates the policy.
#
# `#[napi]` expands to a module constructor that carries its own `#[allow(unsafe_code)]`,
# and `forbid` is precisely the level that cannot be overridden — not by an inner
# attribute, not by a macro. So an addon under `forbid` does not compile, and the error
# points at the `#[napi]` line while naming no policy. Cargo does not allow a member to
# override `workspace.lints` either, so restating is the only way to say `deny` here.
#
# `deny` is still a gate: unsafe code written by hand in this crate is rejected, and
# re-enabling it takes an explicit `#[allow]` a reviewer can see. That is the property this
# crate relies on — nothing in `src/` is unsafe. An addon is a boundary onto a C ABI, so
# some unsafe belongs to the layer rather than to anything written here. The other members,
# including the published `geoquery`, stay on `forbid`.
#
# The remaining keys are copied verbatim from `[workspace.lints]` and must move with it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
# The tests in `tests/lib.rs` decode the response to assert on it. Reaching for
# `serde_json` there rather than a string compare is what lets them assert that the engine
# *agreed* rather than that it produced a particular substring.
serde_json.workspace = true
