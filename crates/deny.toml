# The dependency policy, checked by `pixi run deny` and therefore by CI.
#
# `cargo deny` reads this from the Cargo workspace root, which is this directory (see
# the `[workspace]` table in Cargo.toml), so a policy checked out anywhere else would be
# silently ignored.

[graph]
# Every optional dependency is in the graph, not just the ones this build happens to
# turn on. An advisory in a feature nobody uses today is an advisory waiting for the
# feature that turns it on.
all-features = true

[advisories]
version = 2
# A yanked advisory is an advisory with a known fix available. Ignoring yanked versions
# is how a RUSTSEC lands in a binary after the ecosystem has already moved on.
yanked = "deny"
# Tell cargo-deny to fetch the advisory database at all; the default (`true`) is spelled
# out so turning it off is a visible, deliberate edit rather than an inherited surprise.
ignore = []

[licenses]
# The project's own licence is MIT OR Apache-2.0, and the list below is the union of what
# the two of them actually pull in today. `cargo deny list` reports four licences across
# 29 crates: Apache-2.0 and MIT for clap, serde_json and the proc-macro chain,
# Unicode-3.0 for unicode-ident, and Unlicense for memchr — which is `Unlicense OR MIT`,
# so the MIT arm is what satisfies it.
#
# The list is the *observed* set, not a hopeful one. An allowance for a licence no
# dependency carries is a licence decision that was never made, and cargo-deny reports
# each of those as `license-not-encountered`; keeping the list tight means those warnings
# are real signals, so adding a dependency under a new licence has to be an edit here
# that a reviewer can see. `pixi run deny` must print no `license-not-encountered`
# warnings: that is the check that the policy and the graph still agree.
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  # memchr is `Unlicense OR MIT`. Named explicitly rather than dropped because the
  # explicit list is where the choice is reviewable; cargo-deny accepts either arm.
  "Unlicense",
]
# Above this, cargo-deny stops matching a licence expression and reports the crate as
# unlicensed. 0.93 is above cargo-deny's own default of 0.8: a rarer expression is more
# likely to be a licence expression the SPDX data got wrong, and a false positive here
# blocks a release for something nobody can fix from inside this file.
confidence-threshold = 0.93

[bans]
# Two majors of the same crate is normal and cheap; three is usually two dependencies
# that could be one. `warn` keeps the report in CI without blocking a release on it —
# the graph is two dependencies deep today, so there is nothing to report yet.
multiple-versions = "warn"
wildcards = "deny"
# The toolchain crates that legitimately float (`*`) are allowlisted by name, not by
# path, so a new wildcard elsewhere still fails.
allow-wildcard-paths = true

[sources]
# The build reads crates.io and nothing else. A dependency pointing anywhere else is a
# supply-chain decision, and `cargo deny` is where it should be noticed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
