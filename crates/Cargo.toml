# The Cargo workspace root, and the package that becomes the `geoquery-cli` conda package.
#
# Both roles are here because of one hard constraint: `pixi-build-rust` builds the
# package by running `cargo install --locked --path <source>`, and `cargo install`
# cannot install from a virtual manifest (`cargo install` has no `-p`, so a member
# cannot be selected out of one). So the directory the conda package is built from has
# to be the root of a workspace that *is* a package. `crates/` is the smallest such
# directory: it holds the binary's sources and the library the binary uses, and nothing
# that is not part of the build.
#
# Consequences, stated once so they are not rediscovered later:
#   - `crates/cli/` has no Cargo.toml. The binary's sources live there because that is
#     where a reader looks for a crate's code; its manifest is this file, reached through
#     `[[bin]] path`.
#   - There is no Cargo.toml at the repository root. `.pixi-sandbox.toml` therefore
#     cannot vendor crates (`cargo_vendor = false` there, with the reason recorded).
#   - The version of the project is owned by the root pixi.toml, not by this file.
#     `pixi run version-check` compares this manifest against it.

[package]
name = "geoquery-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Command-line client for geoquery: one protocol-independent query language for geospatial resources and services"
readme = "README.md"
repository = "https://github.com/Archont561/geoquery"
homepage = "https://github.com/Archont561/geoquery"
keywords = ["geospatial", "stac", "ogc", "query", "cli"]
categories = ["command-line-utilities"]
# Published as the conda package built by crates/pixi.toml, not as a crate on crates.io:
# `pixi publish` is the release path, and a crates.io release would be a second channel
# with its own yank policy to keep in step.
publish = false

[workspace]
# A workspace of two crates: the language, and the client that reads it. Adapters and the
# engine join here as they land; nothing else changes in this file when they do.
members = ["core"]

[workspace.lints.rust]
# A published binary and a library it publishes: panics and `unwrap`s are user-visible
# output, not internal state.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[lints]
workspace = true

[dependencies]
clap = { version = ">=4.5,<5", features = ["derive"] }
# The language, not the transport. The CLI's job is to phrase what core says; a rule that
# lived here would be a rule the service would have to write again.
geoquery-core = { path = "core" }

[[bin]]
# The binary is `geoquery` and the conda package is `geoquery-cli`: a user who installs
# one package gets one command named after the project, not the crate.
name = "geoquery"
path = "cli/src/main.rs"

[profile.release]
# A distributed binary: the user waits for it to download before they can use it.
lto = "thin"
codegen-units = 1
strip = true
