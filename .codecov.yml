codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

# Fixture files are test inputs, not code under test: measuring coverage of a JSON document
# that exists to be parsed is a number that goes up when someone adds a test case and tells
# you nothing about whether the engine handles it. `.knowledge/` is the design corpus and
# `docs/` is the published site, neither of which any test imports.
#
# The two binding crates are the other kind of unmeasurable. `#[pymodule]` and `#[napi]`
# register the extension with an interpreter, so they run only inside a Python or Node
# process that is loading the compiled library — and pytest and bun, which do run them,
# are separate processes with no Rust instrumentation attached. llvm-cov therefore reports
# them as lines no test reaches, which is false. It is the whole file rather than those
# lines because codecov ignores by path: the `invoke` wrapper beside them gives up its
# real coverage too, and that is the price of not carrying a permanent false negative.
ignore:
  - "crates/*/tests/fixtures/**"
  - "crates/node-native/src/lib.rs"
  - "crates/python-native/src/lib.rs"
  - "docs/**"
  - ".knowledge/**"