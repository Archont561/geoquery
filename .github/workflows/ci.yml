name: ci

# The checks job runs one command: `pixi run ci-checks`. pixi.toml is the source of truth
# for what the gate *is* — this file says when it runs, on what, and with which caches.
# Listing the individual checks here instead would be a second list, and a second list is
# a list that drifts: a check added to `gates` would pass locally and never run in CI,
# which is the failure mode that looks like a green build. The package-specific work fans
# out through turbo (Rust via cargo, TypeScript via bun, Python via pytest/ruff), and pixi
# prints a header per task, so a failure still names the check that failed.
#
# Three caches, one per tool that owns build output, keep repeat runs cheap and independent:
#   - the pixi environment  (setup-pixi, keyed on pixi.lock) — the toolchain itself
#   - the Cargo build       (registry + git + target/, keyed on Cargo.lock) — compiled crates
#   - the turbo cache       (.turbo) — the TypeScript task outputs turbo can replay
# setup-pixi restores the toolchain, not the compiled artefacts, which is why the second and
# third caches exist alongside it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a branch cancels the first: the newer commit's result is the one that
# matters, and an interrupted build costs nobody an answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `ImageOS`/`ImageVersion` identify the hosted-runner image (e.g. `ubuntu24`,
      # `20260927.320.1`). They exist as process environment variables on the runner, not
      # as entries of the `env` expression context, so a cache step's `key:` cannot read
      # `${{ env.ImageOS }}` directly — that interpolates to an empty string and silently
      # stops scoping anything. Writing them to $GITHUB_ENV here is what makes
      # `${{ env.RUNNER_IMAGE }}` resolve in every later step of this job.
      - name: Expose the runner image for cache keys
        run: echo "RUNNER_IMAGE=${ImageOS}-${ImageVersion}" >> "$GITHUB_ENV"

      # The pixi environment: the whole toolchain (rust, bun, python, the utilities) from
      # one lockfile. `cache: true` keys the restore on pixi.lock.
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true
          environments: default

      # Cargo owns the Rust build cache. setup-pixi restored the compiler, not the compiled
      # crates; this restores the registry, the git checkouts and target/ so a rerun does
      # not recompile the dependency graph from scratch. Keyed on Cargo.lock, with a prefix
      # fallback so an unchanged lock but changed sources still warm-starts from target/.
      # `RUNNER_IMAGE` is in the key, not just `runner.os`: a crate that links native C
      # (aws-lc-sys, in this graph) bakes the host's glibc into its object files, and a
      # restore-keys fallback that only matches `runner.os` will happily hand a `target/`
      # built on one hosted-runner image to a job running a newer (or older) one. The two
      # glibcs disagree on symbols like `__isoc23_sscanf`, and the result is a link failure
      # that has nothing to do with the commit under test — it is the cache serving an
      # incompatible binary. Scoping the key to the image makes that collision impossible:
      # an image bump costs one cold build, not a flaky link error.
      - name: Cache Cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ env.RUNNER_IMAGE }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUNNER_IMAGE }}-cargo-

      # Turbo owns the cross-package cache for the TypeScript workspace. The Rust and Python
      # turbo nodes are `cache: false` — cargo (above) and the instrumented coverage run own
      # their output — so this cache is the TypeScript/docs task replay. Newest restore wins.
      - name: Cache turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # The lockfile is the environment. A solution that differs from it is not this
      # project's environment, and `--frozen-lockfile` is what makes a stale pixi.lock a
      # failure at this step rather than a silently different dependency graph later.
      - name: Install the locked environment
        run: pixi install --locked

      # The gate. One command, because pixi.toml already holds the list.
      #
      # `ci-checks` is `gates` plus `cov`: everything that must pass before a commit
      # lands, then the suites again under instrumentation to produce the reports the
      # next step uploads. Coverage is separate from the test run on purpose — doctests
      # are not measured by llvm-cov on stable, so they stay gated by `gates` rather than
      # being dropped here.
      - name: Run the CI checks
        run: pixi run ci-checks

      # Uploaded whether or not CODECOV_TOKEN is set (tokenless works for a public repo);
      # `fail_ci_if_error: false` keeps a Codecov outage from failing a green build.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Every report `ci-checks` produces. A path missing from this list is a
          # package whose lines are measured and then silently dropped from the project
          # total, which is worse than not measuring it: the number still looks complete.
          files: >-
            ./target/lcov.info,
            ./python/geoquery/coverage.xml,
            ./packages/geoquery/coverage/lcov.info,
            ./packages/utils/coverage/lcov.info
          fail_ci_if_error: false

  packages:
    name: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true
          environments: default

      # The conda build compiles the CLI through pixi-build-rust; the same Cargo cache keeps
      # that compile off the cold path on a rerun. The key carries the runner image for the
      # same reason the `checks` job's does: a native-linked crate's objects are bound to
      # the host glibc, and a restore-keys fallback scoped only to `runner.os` can hand this
      # job a `target/` built on a different image, which then fails to link on a symbol
      # the two glibcs disagree about (see the `checks` job's cache step for the full story).
      - name: Cache Cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-cargo-

      - name: Install the locked environment
        run: pixi install --locked

      # `pixi publish --target-dir dist` builds both conda packages and writes them here.
      # This is the step that proves a user could install them: the build backend, the
      # compiler pin, the binary name, the runtime dependency resolution and the channel
      # metadata all have to hold. A `cargo build` proves none of that.
      - name: Build the publishable packages
        run: pixi run publish-dist

      # Uploaded because a build nobody can download is a build nobody can check. They are
      # artefacts of a CI run, not a release: the release channel is the release workflow's
      # business.
      - name: Upload the packages
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: conda-packages
          path: dist/*.conda
          if-no-files-found: error

  sandbox:
    name: sandbox plan
    # Validates `.pixi-sandbox.toml` and the publish plan derived from it, without packing
    # or publishing. The transport itself is published by publish-sandbox.yml; this job only
    # refuses to let a malformed plan reach that workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both tools, because the step below needs both: `lint-sandbox-plan` is a pixi task
      # that runs the `pixi-sandbox` binary, so a job with the binary and no pixi fails at
      # `pixi: command not found` before the plan is read at all. The task exists precisely
      # so a local run and this step cannot drift.
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true
          environments: default
      - uses: Archont561/pixi-sandbox/setup@da230c2db2dff8a242c40a89c3a4c66de7777518
        with:
          version: v0.3.2

      - name: Install the locked environment
        run: pixi install --locked

      - name: Validate the sandbox plan
        run: pixi run lint-sandbox-plan
